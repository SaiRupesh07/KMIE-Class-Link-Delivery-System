services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kmie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/kmie
      JWT_SECRET_KEY: local-demo-secret-change-me
      CORS_ORIGINS: http://localhost:5173
    depends_on: [postgres]
    ports: ["8000:8000"]
    command: sh -c 'alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000'
volumes:
  pgdata:
